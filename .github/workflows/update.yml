name: Update playlist

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
  push:
    paths: [channels.json, sources.txt, extra_streams.json, ignore.txt, generate.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 generate.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update playlist" && git push
